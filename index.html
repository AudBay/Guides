<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hearing Aid & App Guide — Bayfields</title>
<style>
  /* ── Google Fonts ── */
  @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');

  /* ── Tokens ── */
  :root {
    --purple-900: #2d1b4e;
    --purple-700: #5a3a8c;
    --purple-600: #6b3fa0;
    --purple-500: #7c4db8;
    --purple-200: #c9b3e8;
    --purple-100: #ede6f7;
    --purple-50:  #f7f4fd;
    --ink:        #1e1a2e;
    --mid:        #4a4360;
    --muted:      #7a7390;
    --rule:       #e4ddf2;
    --white:      #ffffff;
    --accent:     #9b5de5;
  }

  /* ── Reset ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--purple-50);
    color: var(--ink);
    line-height: 1.65;
    min-height: 100vh;
  }

  /* ── Screen: Header ── */
  .site-header {
    background: var(--white);
    border-bottom: 1px solid var(--rule);
    padding: 24px 32px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 6px;
  }

  .logo-wrap img {
    width: 72px;
    height: 72px;
    object-fit: contain;
  }

  .brand-text h1 {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--purple-700);
    line-height: 1;
  }

  .brand-text p {
    font-size: 0.65rem;
    letter-spacing: 0.22em;
    color: var(--muted);
    margin-top: 3px;
    text-transform: uppercase;
  }

  /* ── Client details bar ── */
  .client-bar {
    width: 100%;
    max-width: 860px;
    margin: 20px auto 0;
    padding: 14px 20px;
    background: var(--purple-50);
    border: 1px solid var(--rule);
    border-radius: 8px 8px 0 0;
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    align-items: flex-end;
  }

  .client-bar label {
    display: flex;
    flex-direction: column;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    flex: 1;
    min-width: 140px;
  }

  .client-bar input {
    margin-top: 4px;
    border: none;
    border-bottom: 1.5px solid var(--purple-200);
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
    padding: 4px 2px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .client-bar input:focus { border-bottom-color: var(--purple-600); }
  .client-bar input::placeholder { color: var(--rule); }

  /* ── Brand nav ── */
  .brand-nav {
    display: flex;
    gap: 4px;
    padding: 16px 0 0;
    justify-content: center;
  }

  .brand-nav button {
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px 28px;
    border: 1.5px solid var(--rule);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    background: var(--purple-50);
    color: var(--muted);
    cursor: pointer;
    transition: background 0.18s, color 0.18s;
    position: relative;
    bottom: -1px;
  }

  .brand-nav button:hover { background: var(--purple-100); color: var(--purple-700); }

  .brand-nav button.active {
    background: var(--white);
    color: var(--purple-700);
    border-color: var(--rule);
    border-bottom: 1.5px solid var(--white);
    z-index: 1;
  }

  /* ── Print / PDF button ── */
  .action-bar {
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    justify-content: flex-end;
    padding: 12px 0 0;
  }

  .btn-print {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 8px 18px;
    background: var(--purple-700);
    color: var(--white);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.18s;
  }
  .btn-print:hover { background: var(--purple-900); }
  .btn-print svg { width: 14px; height: 14px; fill: currentColor; }

  /* ── Main content ── */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 0 60px;
  }

  .guide-panel {
    background: var(--white);
    border: 1px solid var(--rule);
    border-top: none;
    border-radius: 0 0 12px 12px;
    padding: 40px 44px;
  }

  .guide-panel h2 {
    font-family: 'Libre Baskerville', serif;
    font-size: 1.45rem;
    font-weight: 700;
    color: var(--purple-900);
    padding-bottom: 16px;
    border-bottom: 2px solid var(--purple-200);
    margin-bottom: 32px;
  }

  /* ── Section cards ── */
  .guide-section {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 0 28px;
    padding: 22px 0;
    border-bottom: 1px solid var(--rule);
  }

  .guide-section:last-child { border-bottom: none; padding-bottom: 0; }

  .section-label {
    padding-top: 2px;
  }

  .section-label h3 {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--purple-600);
    line-height: 1.4;
  }

  .section-label .icon {
    width: 32px;
    height: 32px;
    background: var(--purple-100);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }

  .section-label .icon svg {
    width: 16px;
    height: 16px;
    stroke: var(--purple-600);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .section-body {
    font-size: 0.9rem;
    color: var(--mid);
    line-height: 1.75;
  }

  .section-body p { margin-bottom: 8px; }
  .section-body p:last-child { margin-bottom: 0; }

  .section-body ul {
    list-style: none;
    padding: 0;
  }

  .section-body ul li {
    padding: 3px 0 3px 18px;
    position: relative;
  }

  .section-body ul li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 12px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--purple-400, var(--purple-500));
  }

  .section-body ol {
    padding-left: 20px;
  }

  .section-body ol li { padding: 3px 0; }

  .section-body strong {
    color: var(--ink);
    font-weight: 600;
  }

  .step-note {
    margin-top: 10px;
    padding: 10px 14px;
    background: var(--purple-50);
    border-left: 3px solid var(--purple-500);
    border-radius: 0 6px 6px 0;
    font-size: 0.82rem;
    color: var(--muted);
  }

  /* ── Footer ── */
  .site-footer {
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    padding: 16px;
  }

  /* ══════════════════════════════
     PRINT STYLES
  ══════════════════════════════ */
  @media print {
    body { background: #fff; font-size: 11pt; }

    .site-header {
      padding: 12px 24px 0;
      border-bottom: 1.5pt solid var(--rule);
    }

    .brand-nav, .action-bar, .btn-print { display: none !important; }

    .client-bar {
      border-radius: 0;
      border: none;
      border-bottom: 1pt solid var(--rule);
      padding: 8px 0 12px;
      margin: 8px 0 0;
    }

    .client-bar label { font-size: 7pt; }
    .client-bar input { font-size: 10pt; border-bottom-color: #999; }

    main {
      padding: 0;
      max-width: 100%;
    }

    .guide-panel {
      border: none;
      border-radius: 0;
      padding: 20px 0 0;
      page-break-inside: avoid;
    }

    .guide-panel h2 {
      font-size: 14pt;
      margin-bottom: 16pt;
    }

    .guide-section {
      grid-template-columns: 160px 1fr;
      page-break-inside: avoid;
      padding: 14px 0;
    }

    .section-label .icon { display: none; }

    .section-body { font-size: 9.5pt; color: #333; }

    .site-footer { display: none; }

    .step-note { background: #f5f5f5; border-left-color: #555; }
  }
</style>
</head>

            <li>Flip the tool and press the <strong>new filter</strong> into the receiver opening until seated. Discard the tool.</li>
          </ol>
          <div class="step-note">Wax filters are available from your Bayfields audiologist or can be ordered for home delivery.</div>
        `
      },
      {
        icon: "phone",
        heading: "Using the Widex Moment App",
        body: `
          <p><strong>Home screen:</strong> Displays current programme and real-time sound environment. Both hearing aids are shown with individual battery levels.</p>
          <p><strong>Volume:</strong> Drag the central slider up or down, or tap the <strong>+</strong> / <strong>–</strong> buttons. Adjust each ear independently by tapping the split icon.</p>
          <p><strong>Sound programmes:</strong> Swipe left or right along the programme bar to switch (e.g. Universal, Music, Party, Outdoors).</p>
          <p><strong>Sound Sense Learn:</strong> When prompted, rate your sound experience with a thumbs up or down — the app learns your preferences over time.</p>
          <p><strong>Equaliser (SoundShaper):</strong> Fine-tune treble, mid, and bass in the sound profile settings.</p>
          <div class="step-note">If the app loses connection, close and reopen it. Ensure Bluetooth is enabled and the aids are powered on and within range (approx. 10 metres).</div>
        `
      },
      {
        icon: "battery",
        heading: "Battery &amp; Status",
        body: `
          <p>Live battery percentage for each aid is shown on the Widex Moment app home screen. You will receive an in-app and in-ear alert when battery drops below 20%.</p>
          <ul>
            <li>Full charge typically provides <strong>16–37 hours</strong> of use (varies by streaming).</li>
            <li>A 30-minute quick charge gives approximately <strong>6 hours</strong> of use.</li>
          </ul>
        `
      },
      {
        icon: "location",
        heading: "Find My Hearing Aids",
        body: `
          <p>The Widex Moment app can show the last location where your aids were connected to your smartphone — helpful if you have misplaced them at home or while out.</p>
          <div class="step-note">Location accuracy depends on your phone's Bluetooth connection at the time. The map shows the <strong>last connected position</strong> only and does not update in real time.</div>
        `
      }
    ]
  }
};

// ─────────────────────────────────────────
// Render
// ─────────────────────────────────────────
function loadGuide(brand) {
  const container = document.getElementById('guide-content');
  const data = guides[brand];

  document.querySelectorAll('.brand-nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + brand).classList.add('active');

  let html = `<h2>${data.title}</h2>`;
  data.sections.forEach(sec => {
    html += `
      <div class="guide-section">
        <div class="section-label">
          <div class="icon">${icons[sec.icon] || icons.tool}</div>
          <h3>${sec.heading}</h3>
        </div>
        <div class="section-body">${sec.body}</div>
      </div>`;
  });

  container.innerHTML = html;
}

window.onload = () => loadGuide('oticon');
</script>
